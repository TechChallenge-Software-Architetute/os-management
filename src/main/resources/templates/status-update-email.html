<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atualizacao de Status - OS Management</title>
</head>
<body style="margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f4;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width: 600px; margin: 0 auto; background-color: #ffffff;">
        <tr>
            <td style="background-color: #1a237e; padding: 30px 40px; text-align: center;">
                <h1 style="color: #ffffff; margin: 0; font-size: 24px; font-weight: 600;">Oficina Mecanica</h1>
                <p style="color: #b3b3ff; margin: 5px 0 0 0; font-size: 14px;">OS Management</p>
            </td>
        </tr>
        <tr>
            <td style="padding: 40px;">
                <p style="color: #333333; font-size: 16px; margin: 0 0 20px 0;">Ola <strong>{{clientName}}</strong>,</p>
                <p style="color: #555555; font-size: 15px; line-height: 1.6; margin: 0 0 25px 0;">{{statusMessage}}</p>
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="margin: 0 0 25px 0;">
                    <tr>
                        <td style="background-color: #e8eaf6; border-radius: 8px; padding: 20px; text-align: center;">
                            <p style="color: #666666; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin: 0 0 8px 0;">Status Atual</p>
                            <p style="color: #1a237e; font-size: 20px; font-weight: 700; margin: 0;">{{status}}</p>
                        </td>
                    </tr>
                </table>
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="margin: 0 0 30px 0;">
                    <tr>
                        <td style="background-color: #fafafa; border-left: 4px solid #1a237e; padding: 15px 20px;">
                            <p style="color: #666666; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin: 0 0 5px 0;">Veiculo</p>
                            <p style="color: #333333; font-size: 16px; font-weight: 500; margin: 0;">{{vehicleInfo}}</p>
                        </td>
                    </tr>
                </table>
                <p style="color: #888888; font-size: 13px; margin: 0;">Se tiver alguma duvida, entre em contato conosco.</p>
            </td>
        </tr>
        <tr>
            <td style="background-color: #f8f8f8; padding: 25px 40px; border-top: 1px solid #eeeeee;">
                <p style="color: #999999; font-size: 12px; margin: 0; text-align: center;">Oficina Mecanica — OS Management<br/>Este e um email automatico. Por favor, nao responda.</p>
            </td>
        </tr>
    </table>
</body>
</html>
