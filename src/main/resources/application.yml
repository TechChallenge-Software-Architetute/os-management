spring:
  application:
    name: workshop
  # PostgreSQL connection — defaults match docker-compose setup.
  # Override via environment variables (DB_USERNAME, DB_PASSWORD) for other environments.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:15432/workshop}
    uername: ${SPRING_DATASOURCE_USERNAME:user}
    password: ${SPRING_DATASOURCE_PASSWORD:password}

  jpa:
    hibernate:
      # Auto-creates/updates tables from JPA entities. Use 'validate' or a migration tool (Flyway/Liquibase) in production.
      ddl-auto: update
      #ddl-auto: validate
    # Logs SQL queries to console — useful for development debugging.
    show-sql: false
    # Required because the main app class is in com.os.workshop but entities live in com.os.features.
    # Spring Boot 4 removed @EntityScan, so this property tells Hibernate where to find @Entity classes.
    packages-to-scan: com.os
    properties:
      hibernate:
        format_sql: true
        # Explicitly sets PostgreSQL dialect for correct SQL generation.
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  file:
    name: /tmp/app.log
  level:
    root: INFO

management:
  metrics:
    tags:
      service: ${DD_SERVICE:${spring.application.name}}
      env: ${DD_ENV:local}
      version: ${DD_VERSION:local}
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  datadog:
    metrics:
      export:
        enabled: ${DD_METRICS_ENABLED:false}
        api-key: ${DD_API_KEY:}
        uri: ${DD_METRICS_URI:https://api.datadoghq.com}
        step: 1m

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:akmsdkmasfnjsgknakmsdkmasdkmsadfkmdsakmdkmsadsa}
  expiration: ${JWT_EXPIRATION:86400000}

springdoc:
  enable-data-rest: false

aws:
  sns:
    region: ${AWS_REGION:us-east-1}
    topic-arn: ${AWS_SNS_TOPIC_ARN:arn:aws:sns:us-east-1:798294347765:os-management-fiap:cb7009aa-c1dd-44cf-abdb-af9c1f1686ff}
