apiVersion: v1
kind: Service
metadata:
  name: os-management-service
  namespace: os-management
  labels:
    app: os-management
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: LoadBalancer
  selector:
    app: os-management
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  sessionAffinity: None
