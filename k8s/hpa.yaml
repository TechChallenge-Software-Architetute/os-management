apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: os-management
  namespace: os-management
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: os-management
  minReplicas: 1
  # Cap at node capacity: 2x t3.small, each fits ~1 app pod. No cluster
  # autoscaler, so a higher ceiling only produces unschedulable Pending pods.
  maxReplicas: 2
  metrics:
    # CPU only. A JVM idles near its memory request, so a memory-based target
    # trips immediately at idle and over-scales past what the nodes can hold.
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
      selectPolicy: Max
