apiVersion: v1
kind: ConfigMap
metadata:
  name: os-management-config
  namespace: os-management
data:
  SERVER_PORT: "8080"
  SPRING_APPLICATION_NAME: workshop
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:15432/workshop
  SPRING_JPA_HIBERNATE_DDL_AUTO: update
  SPRING_JPA_SHOW_SQL: "false"
  JWT_EXPIRATION: "86400000"
  # Datadog unified service tagging + Micrometer export (agentless HTTP).
  # DD_ENV defaults to "local" for the Kind cluster; override per environment.
  DD_ENV: "local"
  DD_SERVICE: "os-management"
  DD_VERSION: "1.0.0"
  DD_METRICS_ENABLED: "true"
  DD_METRICS_URI: "https://api.datadoghq.com"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: os-management
data:
  POSTGRES_DB: workshop
  POSTGRES_USER: user
  PGDATA: /var/lib/postgresql/data/pgdata
