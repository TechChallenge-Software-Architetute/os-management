# Helm values for the official datadog/datadog chart.
# Installs the Node Agent (DaemonSet) + Cluster Agent so the dashboard's
# kubernetes.* metrics and trace.servlet.request (APM) panels get data, which
# the app-only Micrometer export cannot provide (see DEPENDENCIES.md §2.5).
#
#   helm repo add datadog https://helm.datadoghq.com
#   kubectl create secret generic datadog-secret \
#     --namespace datadog --from-literal api-key="$DD_API_KEY"
#   helm upgrade --install datadog datadog/datadog \
#     --namespace datadog --create-namespace -f k8s/datadog/values.yaml
datadog:
  # API key is read from a pre-created secret so it never lives in git.
  # Secret key MUST be named "api-key".
  apiKeyExistingSecret: datadog-secret
  site: datadoghq.eu
  clusterName: os-management
  # kube-state-metrics powers kubernetes.cpu.* / kubernetes.memory.* panels.
  kubeStateMetricsEnabled: true
  logs:
    enabled: true
    # Per-pod opt-in via ad.datadoghq.com/<container>.logs annotations, so we
    # do NOT collect logs from every workload in the cluster.
    containerCollectAll: false
  apm:
    # Expose the trace-agent on TCP 8126; the injected dd-java-agent ships
    # traces here → trace.servlet.request.
    portEnabled: true
  processAgent:
    enabled: true

clusterAgent:
  enabled: true
  admissionController:
    # Injects dd-java-agent into pods carrying the
    # admission.datadoghq.com/java-lib.version annotation (see k8s/app.yaml).
    enabled: true
    mutateUnlabelled: false
