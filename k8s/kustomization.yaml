apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: os-management
resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - postgres.yaml
  - postgres-init-job.yaml
  - app.yaml
  - ingress.yaml
  - hpa.yaml

configMapGenerator:
  - name: postgres-init
    files:
      - init.sh

generatorOptions:
  disableNameSuffixHash: true
