apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-init
  namespace: os-management
  labels:
    app: postgres-init
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: postgres-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: postgres-init
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              until pg_isready --host=postgres --username="$POSTGRES_USER" --dbname=postgres; do
                echo "Aguardando PostgreSQL..."
                sleep 2
              done
              exec /bin/bash /scripts/init.sh
          env:
            - name: PGHOST
              value: postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          envFrom:
            - configMapRef:
                name: postgres-config
            - secretRef:
                name: postgres-secret
          volumeMounts:
            - name: postgres-init
              mountPath: /scripts/init.sh
              subPath: init.sh
              readOnly: true
      volumes:
        - name: postgres-init
          configMap:
            name: postgres-init
            defaultMode: 0755
