apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: os-management
  namespace: os-management
  labels:
    app: os-management
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - host: os-management.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: os-management
                port:
                  name: http
