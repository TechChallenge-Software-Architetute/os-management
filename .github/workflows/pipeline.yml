name: pipeline

on:
  push:

jobs:

  unit-test:
    runs-on: ubuntu-latest

    steps:
      - name: Fazer checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Executar testes unitários
        run: mvn test

      - name: Gerar badge de cobertura JaCoCo
        id: jacoco
        uses: cicirello/jacoco-badge-generator@v2.0.1

      - name: Exibir percentual de cobertura
        run: |
          echo "cobertura = ${{ steps.jacoco.outputs.coverage }}"
          echo "cobertura de branches = ${{ steps.jacoco.outputs.branches }}"

      - name: Fazer upload do relatório JaCoCo
        uses: actions/upload-artifact@v4.4.0
        continue-on-error: true
        with:
          name: jacoco-report
          path: target/site/jacoco
          retention-days: 7
          overwrite: true

  code-analysis:
    runs-on: ubuntu-latest
    needs: unit-test

    steps:
      - name: Fazer checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Gerar relatório JaCoCo
        run: mvn verify -DskipTests

  build:
    runs-on: ubuntu-latest
    needs: code-analysis

    steps:
      - name: Fazer checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Empacotar aplicação
        run: mvn package -DskipTests

  publish:
    runs-on: ubuntu-latest
    needs: build
    # Publica no GitHub Packages apenas em develop/main — evita acumular
    # versoes a cada push de feature branch (estoura a cota de storage).
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    outputs:
      publish_version: ${{ steps.publish-version.outputs.publish_version }}
    permissions:
      contents: write
      packages: write

    steps:
      - name: Fazer checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Incrementar versão no pom.xml
        run: |
          mvn build-helper:parse-version versions:set -DnewVersion=\${parsedVersion.majorVersion}.\${parsedVersion.minorVersion}.\${parsedVersion.nextIncrementalVersion} -DgenerateBackupPoms=false

      - name: Preparar versao unica para publicacao
        id: publish-version
        run: |
          RELEASE_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          PUBLISH_VERSION="${RELEASE_VERSION}-build.${{ github.run_id }}.${{ github.run_attempt }}"
          mvn versions:set -DnewVersion="$PUBLISH_VERSION" -DgenerateBackupPoms=false
          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "publish_version=$PUBLISH_VERSION" >> "$GITHUB_OUTPUT"

      - name: Publicar pacote
        run: mvn --batch-mode deploy -DskipTests --settings settings.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restaurar versao limpa no pom.xml
        run: |
          mvn versions:set -DnewVersion="${{ steps.publish-version.outputs.release_version }}" -DgenerateBackupPoms=false

      - name: Fazer commit e enviar atualização de versão
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pom.xml
          git commit -m "Bump versão para próximo build [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build-push:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: read
      packages: write
    outputs:
      publish_version: ${{ needs.publish.outputs.publish_version }}

    steps:
      - name: Fazer checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Extrair hash do commit
        id: hash
        run: |
          HASH=$(git rev-parse --short HEAD)
          echo "hash=$HASH" >> $GITHUB_OUTPUT

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Fazer login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Construir e enviar imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/os-management:latest
            ${{ secrets.DOCKER_USERNAME }}/os-management:v${{ needs.publish.outputs.publish_version }}
            ${{ secrets.DOCKER_USERNAME }}/os-management:v${{ needs.publish.outputs.publish_version }}-${{ steps.hash.outputs.hash }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/os-management:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/os-management:buildcache,mode=max

  # ---------------------------------------------------------------------------
  # Terraform LOCAL — usa Kind (cluster efêmero) quando AWS não está configurada
  # ---------------------------------------------------------------------------
  terraform-local:
    runs-on: ubuntu-latest
    needs: docker-build-push
   
    if: vars.USE_AWS != 'true' && github.ref == 'refs/heads/develop'

    steps:
      - name: Fazer checkout do código
        uses: actions/checkout@v4

      - name: Criar cluster Kind
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: os-management

      - name: Instalar ingress-nginx no Kind
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml
          kubectl wait --namespace ingress-nginx \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=90s

      - name: Exportar credenciais do cluster
        run: |
          kubectl create serviceaccount terraform-sa -n kube-system
          kubectl create clusterrolebinding terraform-sa-admin \
            --clusterrole=cluster-admin \
            --serviceaccount=kube-system:terraform-sa

          echo "KUBE_HOST=$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')" >> $GITHUB_ENV
          echo "KUBE_CA=$(kubectl config view --minify --raw -o jsonpath='{.clusters[0].cluster.certificate-authority-data}')" >> $GITHUB_ENV
          echo "KUBE_TOKEN=$(kubectl create token terraform-sa -n kube-system --duration=1h)" >> $GITHUB_ENV
          echo "KUBE_CONFIG=$(kubectl config view --minify --raw | base64 -w 0)" >> $GITHUB_ENV

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform
        run: |
          terraform apply -auto-approve \
            -var="use_aws=false" \
            -var="db_user=${{ secrets.DB_USER }}" \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="jwt_secret=${{ secrets.JWT_SECRET }}" \
            -var="kubernetes_host=${{ env.KUBE_HOST }}" \
            -var="kubernetes_token=${{ env.KUBE_TOKEN }}" \
            -var="kubernetes_ca_certificate=${{ env.KUBE_CA }}" \
            -var="kube_config=${{ env.KUBE_CONFIG }}"

      - name: Atualizar imagem do Deployment
        run: |
          IMAGE="${{ secrets.DOCKER_USERNAME }}/os-management:v${{ needs.docker-build-push.outputs.publish_version }}"
          kubectl set image deployment/os-management os-management=$IMAGE -n os-management
          kubectl rollout status deployment/os-management -n os-management --timeout=120s

  # ---------------------------------------------------------------------------
  # Terraform AWS — EC2 t3.micro + RDS db.t3.micro (free tier)
  # Roda quando USE_AWS == 'true' e USE_EKS != 'true'.
  # Usa backend S3 para persistir o state entre execucoes (bucket: TF_STATE_BUCKET).
  # ---------------------------------------------------------------------------
  terraform-ec2:
    runs-on: ubuntu-latest
    needs: docker-build-push

    if: vars.USE_AWS == 'true' && github.ref == 'refs/heads/develop'

    steps:
      - name: Fazer checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Terraform Init
        working-directory: terraform/ec2
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.AWS_REGION || 'us-east-1' }}"

      - name: Importar recursos AWS existentes
        working-directory: terraform/ec2
        shell: bash
        env:
          AWS_VPC_ID: ${{ secrets.AWS_VPC_IC }}
        run: |
          import_if_missing() {
            local address="$1"
            local resource_id="$2"

            if ! terraform state show "$address" >/dev/null 2>&1; then
              terraform import -input=false "$address" "$resource_id"
            fi
          }

          app_sg_id=$(aws ec2 describe-security-groups \
            --filters \
              "Name=vpc-id,Values=$AWS_VPC_ID" \
              "Name=group-name,Values=os-management-app-sg" \
            --query 'SecurityGroups[0].GroupId' \
            --output text 2>/dev/null || true)

          if [ "$app_sg_id" != "None" ] && [ -n "$app_sg_id" ]; then
            import_if_missing "aws_security_group.app" "$app_sg_id"
          fi

          if aws iam get-role \
            --role-name os-management-ec2-role >/dev/null 2>&1; then
            import_if_missing \
              "aws_iam_role.ec2_role[0]" \
              "os-management-ec2-role"
          fi

          if aws iam get-role \
            --role-name os-management-ec2-role >/dev/null 2>&1; then
            import_if_missing \
              "aws_iam_role_policy.sns_publish[0]" \
              "os-management-ec2-role:os-management-sns-publish"
          fi

          if aws iam get-instance-profile \
            --instance-profile-name os-management-ec2-profile >/dev/null 2>&1; then
            import_if_missing \
              "aws_iam_instance_profile.ec2_profile[0]" \
              "os-management-ec2-profile"
          fi

      - name: Terraform Apply
        working-directory: terraform/ec2
        run: |
          terraform apply -auto-approve \
            -var="aws_region=${{ vars.AWS_REGION || 'us-east-1' }}" \
            -var="db_url=${{ secrets.DB_URL }}" \
            -var="db_user=${{ secrets.DB_USER }}" \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="jwt_secret=${{ secrets.JWT_SECRET }}" \
            -var="app_image=${{ secrets.DOCKER_USERNAME }}/os-management:v${{ needs.docker-build-push.outputs.publish_version }}" \
            -var="sns_topic_arn=${{ secrets.AWS_SNS_TOPIC_ARN }}"

            
      - name: Exibir URL da aplicacao
        working-directory: terraform/ec2
        run: |
          echo "========================================"
          echo "App URL: $(terraform output -raw app_url)"
          echo "========================================"
          echo "Aguarde ~3 minutos para o user_data terminar (Docker install + container start)"

  # ---------------------------------------------------------------------------
  # Deploy HOMOL — EKS + RDS (Kubernetes gerenciado na AWS)
  # Stage de homologação. Roda quando USE_EKS == 'true' na branch 'develop'.
  # Cria: VPC + EKS cluster (os-management-homol) + node group + RDS PostgreSQL.
  # Manifests K8s são aplicados via kubectl após o cluster estar ativo.
  # Usa backend S3 (key: homol/terraform.tfstate) para persistir o state.
  # ---------------------------------------------------------------------------
  deploy-homol:
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: vars.USE_EKS == 'true' && github.ref == 'refs/heads/develop'
    environment: homol

    steps:
      - name: Fazer checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: terraform
        run: |
          cat > backend.tf << EOF
          terraform {
            backend "s3" {
              bucket = "${{ vars.TF_STATE_BUCKET }}"
              key    = "homol/terraform.tfstate"
              region = "${{ vars.AWS_REGION || 'us-east-1' }}"
            }
          }
          EOF
          terraform init

      - name: Garantir escala minima do node group
        run: |
          if aws eks describe-nodegroup \
            --cluster-name os-management-homol \
            --nodegroup-name default \
            --region ${{ vars.AWS_REGION || 'us-east-1' }} >/dev/null 2>&1; then
            aws eks update-nodegroup-config \
              --cluster-name os-management-homol \
              --nodegroup-name default \
              --region ${{ vars.AWS_REGION || 'us-east-1' }} \
              --scaling-config minSize=2,desiredSize=2,maxSize=3
            aws eks wait nodegroup-active \
              --cluster-name os-management-homol \
              --nodegroup-name default \
              --region ${{ vars.AWS_REGION || 'us-east-1' }}
          fi

      - name: Terraform Apply — Criar EKS + RDS
        working-directory: terraform
        run: |
          terraform apply -auto-approve \
              -var="use_aws=true" \
              -var="aws_region=${{ vars.AWS_REGION || 'us-east-1' }}" \
              -var="app_name=os-management-homol" \
              -var="environment=staging" \
              -var="db_user=${{ secrets.DB_USER }}" \
              -var="db_password=${{ secrets.DB_PASSWORD }}" \
              -var="jwt_secret=${{ secrets.JWT_SECRET }}" \
              -var="node_instance_type=t3.small" \
              -var="node_min_size=2" \
              -var="node_desired_size=2" \
              -var="node_max_size=3" \
              -var="rds_instance_class=db.t3.micro" \
              -var="rds_multi_az=false"

      - name: Obter JDBC URL do RDS
        id: rds
        working-directory: terraform
        run: |
          echo "jdbc_url=$(terraform output -raw rds_jdbc_url)" >> "$GITHUB_OUTPUT"

      - name: Configurar kubectl para o EKS
        run: |
          aws eks update-kubeconfig --name os-management-homol --region ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Aplicar manifests Kubernetes
        run: |
          JDBC_URL="${{ steps.rds.outputs.jdbc_url }}"
          DB_USER="${{ secrets.DB_USER }}"
          DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
          JWT_SECRET="${{ secrets.JWT_SECRET }}"

          # Metrics Server (necessário para o HPA funcionar)
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml

          # Namespace
          kubectl apply -f k8s/namespace.yaml

          # ConfigMap da app (substitui variável do template)
          sed "s|\${datasource_url}|${JDBC_URL}|g" k8s/app-configmap.yaml.tpl | kubectl apply -f -

          # Secret da app (substitui variáveis do template)
          sed -e "s|\${db_user}|${DB_USER}|g" \
              -e "s|\${db_password}|${DB_PASSWORD}|g" \
              -e "s|\${jwt_secret}|${JWT_SECRET}|g" \
              -e "s|\${external_token}|change-me|g" \
              k8s/app-secret.yaml.tpl | kubectl apply -f -

          # App Deployment + Service
          kubectl apply -f k8s/app.yaml

          # HPA
          kubectl apply -f k8s/hpa.yaml

          # Ingress
          kubectl apply -f k8s/ingress.yaml

      - name: Atualizar imagem do Deployment
        run: |
          IMAGE="${{ secrets.DOCKER_USERNAME }}/os-management:v${{ needs.docker-build-push.outputs.publish_version }}"
          kubectl set image deployment/os-management os-management=$IMAGE -n os-management
          kubectl rollout status deployment/os-management -n os-management --timeout=300s

      - name: Exibir acesso a aplicacao
        run: |
          echo "========================================"
          echo "EKS Cluster: os-management-homol (HOMOL)"
          echo "Namespace: os-management"
          echo "========================================"
          echo "Para acessar localmente:"
          echo "  aws eks update-kubeconfig --name os-management-homol --region ${{ vars.AWS_REGION || 'us-east-1' }}"
          echo "  kubectl port-forward svc/os-management 8080:8080 -n os-management"
          echo "  http://localhost:8080/swagger-ui/index.html"
          echo "========================================"
          echo ""
          echo "LoadBalancer:"
          kubectl get svc os-management -n os-management -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "(ainda provisionando...)"
          echo ""

  # ---------------------------------------------------------------------------
  # Deploy PROD — EKS + RDS (Kubernetes gerenciado na AWS)
  # Stage de produção. Roda quando USE_EKS == 'true' na branch 'main'.
  # Requer aprovação manual: configure o Environment 'prod' em
  #   Settings > Environments > prod > Required reviewers.
  # Cria: VPC + EKS cluster (os-management-prod) + node group + RDS PostgreSQL
  #   com multi_az=true e deletion_protection (via environment=prod no terraform).
  # Usa backend S3 (key: prod/terraform.tfstate) para persistir o state.
  # ---------------------------------------------------------------------------
  deploy-prod:
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: vars.USE_EKS == 'true' && github.ref == 'refs/heads/main'
    environment: prod

    steps:
      - name: Fazer checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: terraform
        run: |
          cat > backend.tf << EOF
          terraform {
            backend "s3" {
              bucket = "${{ vars.TF_STATE_BUCKET }}"
              key    = "prod/terraform.tfstate"
              region = "${{ vars.AWS_REGION || 'us-east-1' }}"
            }
          }
          EOF
          terraform init

      - name: Garantir escala minima do node group
        run: |
          if aws eks describe-nodegroup \
            --cluster-name os-management-prod \
            --nodegroup-name default \
            --region ${{ vars.AWS_REGION || 'us-east-1' }} >/dev/null 2>&1; then
            aws eks update-nodegroup-config \
              --cluster-name os-management-prod \
              --nodegroup-name default \
              --region ${{ vars.AWS_REGION || 'us-east-1' }} \
              --scaling-config minSize=2,desiredSize=2,maxSize=3
            aws eks wait nodegroup-active \
              --cluster-name os-management-prod \
              --nodegroup-name default \
              --region ${{ vars.AWS_REGION || 'us-east-1' }}
          fi

      - name: Terraform Apply — Criar EKS + RDS
        working-directory: terraform
        run: |
          terraform apply -auto-approve \
              -var="use_aws=true" \
              -var="aws_region=${{ vars.AWS_REGION || 'us-east-1' }}" \
              -var="app_name=os-management-prod" \
              -var="environment=prod" \
              -var="db_user=${{ secrets.DB_USER }}" \
              -var="db_password=${{ secrets.DB_PASSWORD }}" \
              -var="jwt_secret=${{ secrets.JWT_SECRET }}" \
              -var="node_instance_type=t3.small" \
              -var="node_min_size=2" \
              -var="node_desired_size=2" \
              -var="node_max_size=3" \
              -var="rds_instance_class=db.t3.medium" \
              -var="rds_multi_az=true"

      - name: Obter JDBC URL do RDS
        id: rds
        working-directory: terraform
        run: |
          echo "jdbc_url=$(terraform output -raw rds_jdbc_url)" >> "$GITHUB_OUTPUT"

      - name: Configurar kubectl para o EKS
        run: |
          aws eks update-kubeconfig --name os-management-prod --region ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Aplicar manifests Kubernetes
        run: |
          JDBC_URL="${{ steps.rds.outputs.jdbc_url }}"
          DB_USER="${{ secrets.DB_USER }}"
          DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
          JWT_SECRET="${{ secrets.JWT_SECRET }}"

          # Metrics Server (necessário para o HPA funcionar)
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml

          # Namespace
          kubectl apply -f k8s/namespace.yaml

          # ConfigMap da app (substitui variável do template)
          sed "s|\${datasource_url}|${JDBC_URL}|g" k8s/app-configmap.yaml.tpl | kubectl apply -f -

          # Secret da app (substitui variáveis do template)
          sed -e "s|\${db_user}|${DB_USER}|g" \
              -e "s|\${db_password}|${DB_PASSWORD}|g" \
              -e "s|\${jwt_secret}|${JWT_SECRET}|g" \
              -e "s|\${external_token}|change-me|g" \
              k8s/app-secret.yaml.tpl | kubectl apply -f -

          # App Deployment + Service
          kubectl apply -f k8s/app.yaml

          # HPA
          kubectl apply -f k8s/hpa.yaml

          # Ingress
          kubectl apply -f k8s/ingress.yaml

      - name: Atualizar imagem do Deployment
        run: |
          IMAGE="${{ secrets.DOCKER_USERNAME }}/os-management:v${{ needs.docker-build-push.outputs.publish_version }}"
          kubectl set image deployment/os-management os-management=$IMAGE -n os-management
          kubectl rollout status deployment/os-management -n os-management --timeout=300s

      - name: Exibir acesso a aplicacao
        run: |
          echo "========================================"
          echo "EKS Cluster: os-management-prod (PROD)"
          echo "Namespace: os-management"
          echo "========================================"
          echo "Para acessar localmente:"
          echo "  aws eks update-kubeconfig --name os-management-prod --region ${{ vars.AWS_REGION || 'us-east-1' }}"
          echo "  kubectl port-forward svc/os-management 8080:8080 -n os-management"
          echo "  http://localhost:8080/swagger-ui/index.html"
          echo "========================================"
          echo ""
          echo "LoadBalancer:"
          kubectl get svc os-management -n os-management -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "(ainda provisionando...)"
          echo ""
