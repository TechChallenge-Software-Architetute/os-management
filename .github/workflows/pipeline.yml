name: pipeline

on:
  push:

jobs:

  unit-test:
    runs-on: ubuntu-latest

    steps:
      - name: Fazer checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Executar testes unitários
        run: mvn test

      - name: Gerar badge de cobertura JaCoCo
        id: jacoco
        uses: cicirello/jacoco-badge-generator@v2.0.1

      - name: Exibir percentual de cobertura
        run: |
          echo "cobertura = ${{ steps.jacoco.outputs.coverage }}"
          echo "cobertura de branches = ${{ steps.jacoco.outputs.branches }}"

      - name: Fazer upload do relatório JaCoCo
        uses: actions/upload-artifact@v4.4.0
        with:
          name: jacoco-report
          path: target/site/jacoco

  code-analysis:
    runs-on: ubuntu-latest
    needs: unit-test

    steps:
      - name: Fazer checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Gerar relatório JaCoCo
        run: mvn verify -DskipTests

  build:
    runs-on: ubuntu-latest
    needs: code-analysis

    steps:
      - name: Fazer checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Empacotar aplicação
        run: mvn package -DskipTests

  publish:
    runs-on: ubuntu-latest
    needs: build
    outputs:
      publish_version: ${{ steps.publish-version.outputs.publish_version }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Fazer checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Incrementar versão no pom.xml
        run: |
          mvn build-helper:parse-version versions:set -DnewVersion=\${parsedVersion.majorVersion}.\${parsedVersion.minorVersion}.\${parsedVersion.nextIncrementalVersion} -DgenerateBackupPoms=false

      - name: Preparar versao unica para publicacao
        id: publish-version
        run: |
          RELEASE_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          PUBLISH_VERSION="${RELEASE_VERSION}-build.${{ github.run_id }}.${{ github.run_attempt }}"
          mvn versions:set -DnewVersion="$PUBLISH_VERSION" -DgenerateBackupPoms=false
          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "publish_version=$PUBLISH_VERSION" >> "$GITHUB_OUTPUT"

      - name: Publicar pacote
        run: mvn --batch-mode deploy --settings settings.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restaurar versao limpa no pom.xml
        run: |
          mvn versions:set -DnewVersion="${{ steps.publish-version.outputs.release_version }}" -DgenerateBackupPoms=false

      - name: Fazer commit e enviar atualização de versão
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pom.xml
          git commit -m "Bumpar versão para próximo build [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build-push:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: read
      packages: write

    steps:
      - name: Fazer checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Extrair hash do commit
        id: hash
        run: |
          HASH=$(git rev-parse --short HEAD)
          echo "hash=$HASH" >> $GITHUB_OUTPUT

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Fazer login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Construir e enviar imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/os-management:latest
            ${{ secrets.DOCKER_USERNAME }}/os-management:v${{ needs.publish.outputs.publish_version }}
            ${{ secrets.DOCKER_USERNAME }}/os-management:v${{ needs.publish.outputs.publish_version }}-${{ steps.hash.outputs.hash }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/os-management:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/os-management:buildcache,mode=max
