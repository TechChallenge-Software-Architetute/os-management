name: pipeline

on:
  push:

jobs:

  testes-unitarios:
    runs-on: ubuntu-latest

    steps:
      - name: Fazer checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Executar testes unitários
        run: mvn test

      - name: Gerar badge de cobertura JaCoCo
        id: jacoco
        uses: cicirello/jacoco-badge-generator@v2.0.1

      - name: Exibir percentual de cobertura
        run: |
          echo "cobertura = ${{ steps.jacoco.outputs.coverage }}"
          echo "cobertura de branches = ${{ steps.jacoco.outputs.branches }}"

      - name: Fazer upload do relatório JaCoCo
        uses: actions/upload-artifact@v4.4.0
        with:
          name: jacoco-report
          path: target/site/jacoco

  analise-codigo:
    runs-on: ubuntu-latest
    needs: testes-unitarios

    steps:
      - name: Fazer checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Gerar relatório JaCoCo
        run: mvn verify -DskipTests

  construir-artefato:
    runs-on: ubuntu-latest
    needs: analise-codigo

    steps:
      - name: Fazer checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Empacotar aplicação
        run: mvn package -DskipTests

  publicar-pacote:
    runs-on: ubuntu-latest
    needs: construir-artefato
    permissions:
      contents: read
      packages: write

    steps:
      - name: Fazer checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Publicar pacote
        run: mvn --batch-mode deploy --settings settings.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Incrementar versão no pom.xml
        run: |
          mvn build-helper:parse-version versions:set -DnewVersion=\${parsedVersion.majorVersion}.\${parsedVersion.minorVersion}.\${parsedVersion.nextIncrementalVersion} versions:commit

      - name: Fazer commit e enviar atualização de versão
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pom.xml
          git commit -m "Bumpar versão para próximo build [skip ci]"
          git push origin develop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  construir-e-enviar-docker:
    runs-on: ubuntu-latest
    needs: publicar-pacote
    permissions:
      contents: read
      packages: write

    steps:
      - name: Fazer checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Extrair versão do pom.xml
        id: versao
        run: |
          VERSION=$(grep -oPm1 "(?<=<version>)[^<]+" pom.xml | head -1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Extrair hash do commit
        id: hash
        run: |
          HASH=$(git rev-parse --short HEAD)
          echo "hash=$HASH" >> $GITHUB_OUTPUT

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Fazer login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Construir e enviar imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/os-management:latest
            ${{ secrets.DOCKER_USERNAME }}/os-management:v${{ steps.versao.outputs.version }}
            ${{ secrets.DOCKER_USERNAME }}/os-management:v${{ steps.versao.outputs.version }}-${{ steps.hash.outputs.hash }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/os-management:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/os-management:buildcache,mode=max