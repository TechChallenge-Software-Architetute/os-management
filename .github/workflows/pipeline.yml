name: pipeline

on:
  push:

jobs:

  unit-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run unit tests
        run: mvn test

      - name: Generate JaCoCo Badge
        id: jacoco
        uses: cicirello/jacoco-badge-generator@v2.0.1

      - name: Log coverage percentage
        run: |
          echo "coverage = ${{ steps.jacoco.outputs.coverage }}"
          echo "branch coverage = ${{ steps.jacoco.outputs.branches }}"

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4.4.0
        with:
          name: jacoco-report
          path: target/site/jacoco

  code-analysis:
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Generate JaCoCo Report
        run: mvn verify

  build:
    runs-on: ubuntu-latest
    needs: code-analysis
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Package
        run: mvn package -DskipTests

  publish:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Publish Package
        run: mvn --batch-mode deploy --settings settings.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest

  # ---------------------------------------------------------------------------
  # Terraform LOCAL — usa Kind (cluster efêmero) quando AWS não está configurada
  # ---------------------------------------------------------------------------
  terraform-local:
    runs-on: ubuntu-latest
    needs: docker-build
    if: ${{ secrets.AWS_ACCESS_KEY_ID == '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Create Kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: os-management

      - name: Export kubeconfig
        run: |
          KUBE_CONFIG=$(kubectl config view --minify --raw | base64 -w 0)
          echo "KUBE_CONFIG=${KUBE_CONFIG}" >> $GITHUB_ENV
          KUBE_HOST=$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')
          KUBE_CA=$(kubectl config view --minify --raw -o jsonpath='{.clusters[0].cluster.certificate-authority-data}')
          KUBE_TOKEN=$(kubectl create token default 2>/dev/null || \
            kubectl -n kube-system get secret \
              $(kubectl -n kube-system get sa default -o jsonpath='{.secrets[0].name}') \
              -o jsonpath='{.data.token}' | base64 -d)
          echo "KUBE_HOST=${KUBE_HOST}" >> $GITHUB_ENV
          echo "KUBE_CA=${KUBE_CA}" >> $GITHUB_ENV
          echo "KUBE_TOKEN=${KUBE_TOKEN}" >> $GITHUB_ENV

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform
        run: |
          terraform apply -auto-approve \
            -var="use_aws=false" \
            -var="github_token=${{ secrets.GITHUB_TOKEN }}" \
            -var="db_user=${{ secrets.DB_USER }}" \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="jwt_secret=${{ secrets.JWT_SECRET }}" \
            -var="kubernetes_host=${KUBE_HOST}" \
            -var="kubernetes_token=${KUBE_TOKEN}" \
            -var="kubernetes_ca_certificate=${KUBE_CA}" \
            -var="kube_config=${KUBE_CONFIG}"

  # ---------------------------------------------------------------------------
  # Terraform AWS — EKS + RDS quando AWS_ACCESS_KEY_ID está configurada
  # ---------------------------------------------------------------------------
  terraform-aws:
    runs-on: ubuntu-latest
    needs: docker-build
    if: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Update kubeconfig (EKS)
        run: |
          aws eks update-kubeconfig \
            --name os-management \
            --region ${{ secrets.AWS_REGION || 'us-east-1' }}
          KUBE_CONFIG=$(cat ~/.kube/config | base64 -w 0)
          echo "KUBE_CONFIG=${KUBE_CONFIG}" >> $GITHUB_ENV

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform
        run: |
          terraform apply -auto-approve \
            -var="use_aws=true" \
            -var="aws_region=${{ secrets.AWS_REGION || 'us-east-1' }}" \
            -var="github_token=${{ secrets.GITHUB_TOKEN }}" \
            -var="db_user=${{ secrets.DB_USER }}" \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="jwt_secret=${{ secrets.JWT_SECRET }}" \
            -var="kube_config=${KUBE_CONFIG}"